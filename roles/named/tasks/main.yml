# tasks file for named
- name: Installer BIND
  ansible.builtin.dnf:
    name: bind
    state: present
- name: Activer BIND
  ansible.builtin.service:
    name: named
    state: started
    enabled: yes
- name: Configurer le DNS redirecteur de BIND (Hôte cible)
  template:
    src: templates/named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: '0640'
    backup: yes
  notify: Redémarrer BIND

